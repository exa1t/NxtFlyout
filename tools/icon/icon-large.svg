<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- NxtFlyout app icon (48 px and larger): a flyout card with a play mark, rising above a taskbar. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5BF6"/>
      <stop offset="1" stop-color="#12B5C9"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A4BE0"/>
      <stop offset="1" stop-color="#0E9FB3"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>

  <!-- flyout card -->
  <rect x="44" y="62" width="168" height="92" rx="24" fill="#FFFFFF"/>
  <!-- play mark -->
  <path d="M78 86.5 a7 7 0 0 1 10.6 -6 l34 21.5 a7 7 0 0 1 0 11.9 l-34 21.5 a7 7 0 0 1 -10.6 -6 z" fill="url(#mark)"/>
  <!-- title and artist lines -->
  <rect x="140" y="92" width="50" height="12" rx="6" fill="url(#mark)"/>
  <rect x="140" y="114" width="34" height="12" rx="6" fill="url(#mark)" opacity="0.55"/>

  <!-- taskbar -->
  <rect x="44" y="176" width="168" height="24" rx="12" fill="#FFFFFF" opacity="0.6"/>
</svg>
