# Builds the solution and runs the unit tests on every push and pull request to main,
# so a broken build shows up on GitHub before anyone tries to release it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build NxtFlyout.sln -c Release

      - name: Test
        run: dotnet test NxtFlyout.sln -c Release --no-build --logger "console;verbosity=normal"
